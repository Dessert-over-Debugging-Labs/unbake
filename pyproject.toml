[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unbake"
version = "0.2.0"
description = "YouTube cooking video in, cross-verified structured recipe out — ingredients, amounts, steps, timestamps"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["recipe", "youtube", "video", "extraction", "gemini", "llm", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Dessert-over-Debugging-Labs/unbake"
Documentation = "https://github.com/Dessert-over-Debugging-Labs/unbake/blob/main/docs/architecture.md"
Issues = "https://github.com/Dessert-over-Debugging-Labs/unbake/issues"
Changelog = "https://github.com/Dessert-over-Debugging-Labs/unbake/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
unbake = "unbake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unbake = ["extraction/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 테스트 fixture의 한글 데이터 리터럴은 줄 길이 제한에서 제외
"tests/**" = ["E501"]
